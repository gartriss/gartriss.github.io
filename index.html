<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>hi there!</title>

<link rel="stylesheet" href="https://unpkg.com/7.css">

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: Tahoma, Verdana, Arial, sans-serif;
}

#bgCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
}

.center {
    width: 95vw;
    max-width: 900px;
    margin: 20px auto;
}

.window-body {
    padding: 18px;
}

.music-row {
    display: flex;
    align-items: center;
    gap: 10px;
}

@media (max-width: 600px) {
    .center {
        width: 98vw;
        margin: 10px auto;
    }

    .window-body {
        padding: 12px;
    }

    .title-bar-text {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<canvas id="bgCanvas"></canvas>

<audio id="music" loop autoplay>
    <source src="https://frutigeraeroarchive.org/music/takeshi_abo_lease.mp3" type="audio/mpeg">
</audio>

<div class="center">
    <div class="window active">
        <div class="title-bar">
            <div class="title-bar-text">Welcome Message</div>
            <div class="title-bar-controls">
                <button aria-label="Minimize"></button>
                <button aria-label="Maximize"></button>
                <button aria-label="Close"></button>
            </div>
        </div>

        <div class="window-body">
            <p><b>Hi there!</b></p>
            <p>i'm gartriss, and this is my website!</p>
            <p>Have a nice time here :></p>

            <div class="music-row">
                <button id="toggleMusic">Play</button>
                <span><b>Takeshi Abo – LEASE</b></span>
            </div>

            <hr>

            <div style="text-align:center; margin-top:20px;">
                <a href="https://frutigeraeroarchive.org/">
                    <img src="https://frutigeraeroarchive.org/images/ads/fa_archive_180x180.png" 
                         alt="Frutiger Aero Archive">
                </a>
            </div>
        </div>
    </div>
</div>

<script>
var canvas = document.getElementById("bgCanvas");
var ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

var t = 0;

function plasma() {
    var w = canvas.width;
    var h = canvas.height;

    var img = ctx.createImageData(w, h);
    var data = img.data;

    t += 0.08;

    for (var y = 0; y < h; y++) {
        for (var x = 0; x < w; x++) {

            var v =
                Math.sin(x / 40 + t) +
                Math.sin(y / 30 + t * 1.3) +
                Math.sin((x + y) / 50 + t * 0.7);

            var c = Math.floor((v + 3) * 42);

            var i = (y * w + x) * 4;

            data[i]     = c * 0.6;
            data[i + 1] = c * 0.2;
            data[i + 2] = c;
            data[i + 3] = 255;
        }
    }

    ctx.putImageData(img, 0, 0);
}

setInterval(plasma, 40);

var music = document.getElementById("music");
var btn = document.getElementById("toggleMusic");
var playing = false;

btn.onclick = function () {
    if (playing) {
        music.pause();
        btn.innerHTML = "Play";
        playing = false;
    } else {
        music.play();
        btn.innerHTML = "Pause";
        playing = true;
    }
};
</script>

</body>
</html>
