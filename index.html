<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, minimum-scale=1">
    <title>Gartriss Site</title>
    <link rel="icon" href="https://i.imgur.com/YAoqpRe.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto:wght@300&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(45deg, #FFA500, #000000);
            background-size: 400% 400%;
            animation: gradientAnimation 12s ease infinite;
        }

        @keyframes gradientAnimation {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem;
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            z-index: 1;
            flex-wrap: wrap;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        header.hidden {
            transform: translateY(-100%);
        }

        .toggle-header {
            position: fixed;
            top: 0.5rem;
            right: 0.5rem;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border: none;
            font-size: 1.5rem;
            padding: 0.5rem;
            border-radius: 50%;
            z-index: 2;
            cursor: pointer;
        }

        img {
            height: 10vh;
            margin-right: 2vw;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background-color: #FFA500;
            border: none;
            color: white;
            padding: 1rem;
            margin: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
            border-radius: 5px;
            font-family: 'Roboto', sans-serif;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #FF8C00;
            transform: scale(1.1);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.5);
        }

        .welcome {
            font-size: 2rem;
            margin: 2rem 0;
            text-align: center;
            animation: fadeIn 2s ease;
        }

        p {
            font-size: 1.5rem;
            margin: 1rem;
            text-align: center;
            animation: fadeIn 2.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        footer {
            position: fixed;
            bottom: 1rem;
            text-align: center;
            font-size: 1rem;
        }

        .contact-page {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: fadeIn 1s ease;
        }

        .contact-page button {
            margin-top: 1rem;
            font-size: 1rem;
            padding: 0.5rem 1rem;
        }

        .telegram-button {
            background-color: #00BFFF;
        }

        .youtube-button {
            background-color: #FF0000;
        }

        .hello-message {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            z-index: 10;
            opacity: 0;
            animation: fadeInOut 2s ease forwards;
        }

        @keyframes fadeInOut {
            0% {
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }

        @media (max-width: 767px) {
            header {
                flex-direction: column;
                padding: 1.5rem;
            }

            img {
                margin-bottom: 1rem;
            }

            nav {
                flex-direction: column;
            }

            button {
                font-size: 1rem;
                padding: 1rem;
            }

            .welcome {
                font-size: 1.5rem;
            }

            p {
                font-size: 1rem;
                padding: 0 1rem;
            }

            footer {
                font-size: 1rem;
                padding: 0.5rem;
            }

            .toggle-header {
                display: block;
            }
        }

        @media (min-width: 768px) {
            .toggle-header {
                display: none;
            }
        }
    </style>
    <script>
        function openDownloadPage() {
            window.open('https://sourceforge.net/projects/gartriss-archive/files/', '_blank');
        }

        function showContactPage() {
            document.querySelector('.welcome').style.display = 'none';
            document.querySelector('p').style.display = 'none';
            document.querySelector('.contact-page').style.display = 'flex';
        }

        function goHome() {
            document.querySelector('.welcome').style.display = 'block';
            document.querySelector('p').style.display = 'block';
            document.querySelector('.contact-page').style.display = 'none';
        }

        function openTelegram() {
            window.open('https://t.me/gartriss', '_blank');
        }

        function openYouTube() {
            window.open('https://www.youtube.com/channel/UCyZ6OZlqNJAixnNCoBfs5VA', '_blank');
        }

        window.onload = () => {
            const helloMessage = document.querySelector('.hello-message');
            setTimeout(() => helloMessage.remove(), 2000);

            const toggleButton = document.querySelector('.toggle-header');
            const header = document.querySelector('header');

            toggleButton.addEventListener('click', () => {
                header.classList.toggle('hidden');
            });
        };
    </script>
</head>
<body>
    <button class="toggle-header">⬆</button>
    <header>
        <img src="https://i.imgur.com/YAoqpRe.png" alt="Gartriss Logo">
        <nav>
            <button onclick="goHome()">Home</button>
            <button onclick="openDownloadPage()">Download Roms</button>
            <button onclick="showContactPage()">Contact</button>
        </nav>
    </header>
    <div class="hello-message">Hello! <div class="wait-message">Please, wait...</div></div>
    <div class="welcome">Welcome!</div>
    <p>This is Gartriss website...</p>
    <div class="contact-page">
        <h1>Do you want to tell something in PM? Ok...</h1>
        <button class="telegram-button" onclick="openTelegram()">Telegram</button>
        <button class="youtube-button" onclick="openYouTube()">YouTube</button>
    </div>
    <footer>2024 | Made by AI and Gartriss</footer>
</body>
</html>
